name: Portable build

on:
  push:
    branches: [master]   # this repo's default branch
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading "v" (e.g. 0.1.0). Empty = build/test only.'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-2022   # pinned image => pinned MSVC v143 toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build demo (Release x64)
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable folder
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Verify package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/sdlgf-demo.zip))
          try { $entries = $zip.Entries | ForEach-Object { $_.FullName } } finally { $zip.Dispose() }
          # tests build into the same bin/Release folder as the demo, so guard the release zip
          $tests = @($entries | Where-Object { $_ -match '_test\.exe$' })
          if ($tests.Count -gt 0) {
            throw "Release zip contains test binaries: $($tests -join ', ')"
          }
          # Aseprite files are artist sources; only exported assets belong in the zip
          $ase = @($entries | Where-Object { $_ -match '\.(ase|aseprite)$' })
          if ($ase.Count -gt 0) { throw "Release zip contains Aseprite sources: $($ase -join ', ')" }
          if (-not ($entries -contains 'demo.exe')) { throw "Release zip is missing demo.exe." }
          Write-Host "Zip contents verified: $($entries.Count) files, demo.exe present, no test binaries."

      - uses: actions/upload-artifact@v4
        with:
          name: sdlgf-demo-portable
          path: dist/sdlgf-demo.zip

      - name: Validate release inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/master') {
            throw "Releases are cut from master; this run is on '${{ github.ref }}'."
          }
          if ('${{ github.event.inputs.version }}' -notmatch '^\d+\.\d+\.\d+$') {
            throw "version must look like 0.1.0 (no leading 'v'), got '${{ github.event.inputs.version }}'."
          }
          if (git ls-remote --tags origin "refs/tags/v${{ github.event.inputs.version }}") {
            throw "Tag v${{ github.event.inputs.version }} already exists - pick a new version."
          }

  # Builds and tests on Linux. The render test only reports there (its golden images come from
  # Direct3D 9 and are compared strictly on the direct3d11 driver only); every other test gates.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             g++-14 cmake ninja-build pkg-config             libasound2-dev libpulse-dev libudev-dev libdbus-1-dev             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev             libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build --parallel -- -k 0   # keep going: list every error, not just the first

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux build
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sdlgf-demo-linux
          path: dist/sdlgf-demo-linux-x86_64.tar.gz

  # Publishes the release with both binaries attached, so it only runs once the Windows and
  # Linux jobs have produced and verified their packages.
  release:
    needs: [build, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # softprops/action-gh-release creates the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdlgf-demo-*
          path: dist
          merge-multiple: true

      - name: Check release assets
        run: |
          ls -l dist
          test -f dist/sdlgf-demo.zip
          test -f dist/sdlgf-demo-linux-x86_64.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # A tag push releases its own tag; a manual run turns the version input into
          # v<version> and the action creates that tag on the commit that was just built.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: sdlgf demo ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/sdlgf-demo.zip
            dist/sdlgf-demo-linux-x86_64.tar.gz
