name: Portable build

on:
  push:
    branches: [master]   # this repo's default branch
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # pinned image => pinned MSVC v143 toolchain
    permissions:
      contents: write       # softprops/action-gh-release needs this to attach the zip to the release
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build demo (Release x64)
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable folder
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: sdlgf-demo-portable
          path: dist/sdlgf-demo.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sdlgf-demo.zip

  # Experiment: has the code ever built off Windows? Not gating yet (continue-on-error): read the
  # log to see what is left. Everything but the render test must pass; the render test only
  # reports there (its golden images come from Direct3D 9).
  linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             g++-14 cmake ninja-build pkg-config             libasound2-dev libpulse-dev libudev-dev libdbus-1-dev             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev             libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build --parallel -- -k 0   # keep going: list every error, not just the first

      - name: Test
        run: ctest --test-dir build --output-on-failure
